name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Notebooks are valid nbformat
        run: |
          python - <<'PY'
          import glob, nbformat
          for path in glob.glob("notebooks/**/*.ipynb", recursive=True):
              nbformat.validate(nbformat.read(path, as_version=4))
              print("valid:", path)
          PY

      - name: Demo data matches the dashboard schema
        run: |
          python scripts/generate_demo_data.py --out .tmp_demo --force
          python scripts/validate_dashboard_data.py .tmp_demo

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dashboard smoke test
        run: |
          npm install
          node tests/dashboard_smoke.js .tmp_demo
